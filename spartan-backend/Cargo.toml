[package]
name = "spartan-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
acir = { git = "https://github.com/eid-privacy/noir", rev = "aac6859426c78b03358de4128a7ae0e68546f31a", features = ["t256"] }
#acir = { path = "../../noir/acvm-repo/acir", features = ["t256"] }
acvm = { git = "https://github.com/eid-privacy/noir", rev = "aac6859426c78b03358de4128a7ae0e68546f31a", features = ["t256"] }
#acvm = { path = "../../noir/acvm-repo/acvm", features = ["t256"] }
bellpepper-core = "0.4.0"
ff = "0.13.1"
noirc_abi = { git = "https://github.com/eid-privacy/noir", rev = "aac6859426c78b03358de4128a7ae0e68546f31a", features = ["t256"] }
#noirc_abi = { path = "../../noir/tooling/noirc_abi", features = ["t256"] }
noirc_artifacts = { git = "https://github.com/eid-privacy/noir", rev = "aac6859426c78b03358de4128a7ae0e68546f31a" }
#noirc_artifacts = { path = "../../noir/tooling/noirc_artifacts" }
noir_artifact_cli = {  git = "https://github.com/eid-privacy/noir", rev = "aac6859426c78b03358de4128a7ae0e68546f31a" }
#noir_artifact_cli = { path = "../../noir/tooling/artifact_cli" }
num-bigint = {version="0.4.3", features = ["rand"]}
num-traits = "0.2.14"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
spartan2 = { version = "0.7.0", default-features = false}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
