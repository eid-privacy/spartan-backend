[package]
name = "spartan-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
acir = { git = "https://github.com/eid-privacy/noir", tag = "t256-v0.26", features = [
  "t256",
] }
#acir = { path = "../../noir/acvm-repo/acir", features = ["t256"] }
acvm = { git = "https://github.com/eid-privacy/noir", tag = "t256-v0.26", features = [
  "t256",
] }
#acvm = { path = "../../noir/acvm-repo/acvm", features = ["t256"] }
bellpepper-core = "0.4.0"
ff = "0.13.1"
noirc_abi = { git = "https://github.com/eid-privacy/noir", tag = "t256-v0.26", features = [
  "t256",
] }
#noirc_abi = { path = "../../noir/tooling/noirc_abi", features = ["t256"] }
noirc_artifacts = { git = "https://github.com/eid-privacy/noir", tag = "t256-v0.26" }
#noirc_artifacts = { path = "../../noir/tooling/noirc_artifacts" }
noir_artifact_cli = { git = "https://github.com/eid-privacy/noir", tag = "t256-v0.26" }
#noir_artifact_cli = { path = "../../noir/tooling/artifact_cli" }
num-bigint = "0.5"
num-traits = "0.2.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.6.0", features = ["derive"] }
algebra-utils = { path = "../algebra-utils" }
bellpepper = "0.4.1"
bincode = "1.3"
base64 = "0.22"
vega-prover = "0.1.0"

# Release-grade optimizations plus full debug info so samply can resolve
# symbols and line numbers in the flamegraph. Used by scripts/samply.sh.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.release]
lto = "fat"
codegen-units = 1
