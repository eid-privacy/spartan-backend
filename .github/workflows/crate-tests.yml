name: Crate tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          project-path: .
          enable-cache: 'true'   # caches the Nix store between runs (separate from the binary cache)
          extra-nix-config: |
            extra-substituters = https://eid-privacy.cachix.org
            extra-trusted-public-keys = eid-privacy.cachix.org-1:lxRzvjcWd/A6Wew1tq0IK6OIMVWNJKUTy4s7EKb6C2A=

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spartan-backend
            algebra-utils
            c020x_verifier
            preprocessing/c0200_siyu_jwt
            preprocessing/c0201_sicpa_backend
            preprocessing/ecdsa_pop
            preprocessing/ecdsa_pok
            preprocessing/zkattest_pok

      - name: Run circuits
        run: devbox run start

      - name: Test all standalone crates (deny warnings)
        run: devbox run test-crates

      - name: End-to-end c020x_verifier test (c0200, c0202)
        run: devbox run e2e-verifier-test
